<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجرنا - خدمة العملاء</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Floating Chat Widget Styles */
        .chat-widget-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 60px;
            height: 60px;
            background-color: #008069;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 1000;
            transition: transform 0.2s;
        }
        .chat-widget-btn:hover {
            transform: scale(1.1);
            background-color: #005c4b;
        }
        .chat-widget-btn svg {
            width: 30px;
            height: 30px;
            fill: white;
        }

        .chat-container {
            position: fixed;
            bottom: 90px;
            left: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            width: 350px;
            height: 500px;
            display: none; /* Hidden by default */
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;
        }
        .chat-header {
            background-color: #008069;
            color: white;
            padding: 15px 20px;
            font-size: 1.1em;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5em;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }
        .close-btn:hover {
            color: #ddd;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 15px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #d9fdd3;
            align-self: flex-end;
            border-bottom-left-radius: 0;
        }
        .bot-message {
            background-color: #f0f0f0;
            align-self: flex-start;
            border-bottom-right-radius: 0;
        }
        .input-area {
            display: flex;
            padding: 15px;
            background-color: #f0f0f0;
            border-top: 1px solid #ddd;
        }
        .input-area input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            font-size: 1em;
            font-family: inherit;
        }
        .input-area button {
            background-color: #008069;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            margin-right: 10px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            font-family: inherit;
        }
        .input-area button:hover {
            background-color: #005c4b;
        }
        .typing-indicator {
            align-self: flex-start;
            color: #888;
            font-size: 0.9em;
            display: none;
        }
    </style>
</head>
<body>

<!-- Dummy content to show it's a website -->
<div style="max-width: 800px; margin: 0 auto; text-align: center; padding-top: 50px;">
    <h1 style="color: #008069;">مرحباً بك في متجرنا</h1>
    <p>تصفح أحدث المنتجات واكتشف عروضنا المميزة.</p>
    <p style="color: #666; margin-top: 20px;">اضغط على أيقونة المحادثة في الأسفل للتواصل مع خدمة العملاء.</p>
</div>

<!-- Floating Chat Button -->
<div class="chat-widget-btn" id="chat-widget-btn" onclick="toggleChat()">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
    </svg>
</div>

<!-- Chat Container -->
<div class="chat-container" id="chat-container">
    <div class="chat-header">
        <span>خدمة العملاء</span>
        <button class="close-btn" onclick="toggleChat()">&times;</button>
    </div>
    <div class="chat-messages" id="chat-messages">
        <div class="message bot-message">
            يا هلا والله! نورت متجرنا. كيف أقدر أخدمك اليوم؟
        </div>
    </div>
    <div class="typing-indicator" id="typing-indicator">جاري الكتابة...</div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">إرسال</button>
    </div>
</div>

<script>
    const chatContainer = document.getElementById('chat-container');
    const chatMessages = document.getElementById('chat-messages');
    const userInput = document.getElementById('user-input');
    const typingIndicator = document.getElementById('typing-indicator');

    function toggleChat() {
        if (chatContainer.style.display === 'none' || chatContainer.style.display === '') {
            chatContainer.style.display = 'flex';
            userInput.focus();
        } else {
            chatContainer.style.display = 'none';
        }
    }

    function appendMessage(text, isUser) {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message');
        messageDiv.classList.add(isUser ? 'user-message' : 'bot-message');
        messageDiv.textContent = text;
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function sendMessage() {
        const message = userInput.value.trim();
        if (!message) return;

        appendMessage(message, true);
        userInput.value = '';
        typingIndicator.style.display = 'block';
        chatMessages.scrollTop = chatMessages.scrollHeight;

        try {
            const response = await fetch('/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ message: message })
            });

            const data = await response.json();
            typingIndicator.style.display = 'none';

            if (response.ok) {
                appendMessage(data.response, false);
            } else {
                appendMessage('عذراً، حدث خطأ: ' + (data.error || 'غير معروف'), false);
            }
        } catch (error) {
            typingIndicator.style.display = 'none';
            appendMessage('عذراً، فشل الاتصال بالخادم.', false);
        }
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }
</script>

</body>
</html>
